[project]
name = "fiscal-es"
version = "0.4.1"
description = "Genera el modelo 303 (IVA trimestral) para autónomos a partir del libro registro, como MCP y CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "typer>=0.12",
    "fastmcp>=2.10",
]

[project.scripts]
fiscal = "fiscal_es.cli:app"
fiscal-mcp = "fiscal_es.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscal_es"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
